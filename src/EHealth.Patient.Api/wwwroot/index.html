<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patient Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f5f7fa;font-size:.92rem}
    .topbar{background:#2d6a4f;color:#fff;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem}
    .topbar h1{font-size:1.1rem;margin:0;font-weight:600}
    .card-section{background:#fff;border-radius:8px;border:1px solid #dde3ea;margin-bottom:1.2rem;overflow:hidden}
    .cs-header{background:#f7f9fc;border-bottom:1px solid #dde3ea;padding:.55rem 1rem;font-weight:600;font-size:.85rem;color:#2d6a4f}
    .cs-body{padding:1rem}
    table{font-size:.82rem}
    .mono{font-family:monospace;font-size:.75rem}
    label{font-size:.82rem;font-weight:500;margin-bottom:.2rem}
    .btn-primary{background:#2d6a4f;border-color:#2d6a4f}
    .btn-primary:hover{background:#40916c;border-color:#40916c}
    .consent-badge{font-size:.72rem;padding:.2em .5em;border-radius:4px;background:#d4edda;color:#155724;font-weight:600}
  </style>
</head>
<body>
<div class="topbar">
  <h1>🧑‍⚕️ Patient Portal</h1>
</div>

<div class="container-fluid px-4 py-3" style="max-width:960px">

  <!-- REGISTER -->
  <div class="card-section">
    <div class="cs-header">Register Patient</div>
    <div class="cs-body">
      <div class="row g-2">
        <div class="col-md-2"><label>First name</label><input id="fn" class="form-control form-control-sm" value="Emily"></div>
        <div class="col-md-2"><label>Last name</label><input id="ln" class="form-control form-control-sm" value="Carter"></div>
        <div class="col-md-2"><label>Date of birth</label><input id="dob" type="date" class="form-control form-control-sm" value="1990-05-15"></div>
        <div class="col-md-2"><label>Gender</label>
          <select id="gender" class="form-select form-select-sm">
            <option>Male</option><option selected>Female</option><option>Other</option>
          </select>
        </div>
        <div class="col-md-3"><label>Email</label><input id="email" class="form-control form-control-sm" value="anna@demo.health"></div>
        <div class="col-md-1 d-flex align-items-end">
          <button class="btn btn-primary btn-sm w-100" onclick="createPatient()">Register</button>
        </div>
      </div>
      <div id="reg-msg" class="mt-2"></div>
    </div>
  </div>

  <!-- PATIENTS LIST -->
  <div class="card-section">
    <div class="cs-header d-flex justify-content-between align-items-center">
      Registered Patients
      <button class="btn btn-outline-secondary btn-sm" onclick="loadPatients()">Refresh</button>
    </div>
    <div class="cs-body p-0">
      <table class="table table-hover table-sm mb-0">
        <thead class="table-light">
          <tr><th>Name</th><th>DOB</th><th>Gender</th><th>Email</th><th>ID</th><th></th></tr>
        </thead>
        <tbody id="patient-list"></tbody>
      </table>
    </div>
  </div>

  <!-- CONSENTS -->
  <div class="card-section" id="consent-section" style="display:none">
    <div class="cs-header">Consents for <span id="consent-name"></span></div>
    <div class="cs-body">
      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <label>Organization ID (Hospital / Lab)</label>
          <input id="org-id" class="form-control form-control-sm" placeholder="e.g. hospital-org-001">
        </div>
        <div class="col-md-3">
          <label>Expires (optional)</label>
          <input id="exp-date" type="datetime-local" class="form-control form-control-sm">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary btn-sm" onclick="grantConsent()">Grant Consent</button>
        </div>
      </div>
      <div id="consent-msg" class="mb-2"></div>
      <table class="table table-sm mb-0">
        <thead class="table-light"><tr><th>Organization</th><th>Granted</th><th>Expires</th><th></th></tr></thead>
        <tbody id="consent-list"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '';
let selectedPatientId = null;

async function get(path){const r=await fetch(API+path);return r.json();}
async function post(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const t=await r.text();throw new Error(t);}return r.json();}
async function del(path){const r=await fetch(API+path,{method:'DELETE'});if(!r.ok) throw new Error(await r.text());}

function msg(id,html,type='success'){document.getElementById(id).innerHTML=`<div class="alert alert-${type} p-2 small mb-0">${html}</div>`;}

async function loadPatients(){
  const rows = await get('/api/patients');
  const tb = document.getElementById('patient-list');
  if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="text-center text-muted py-3">No patients yet</td></tr>';return;}
  tb.innerHTML = rows.map(p=>`
    <tr>
      <td><strong>${p.firstName} ${p.lastName}</strong></td>
      <td>${p.dateOfBirth}</td>
      <td>${p.gender}</td>
      <td>${p.email}</td>
      <td class="mono" title="${p.id}">${p.id.slice(0,8)}…
        <button class="btn btn-link btn-sm p-0 ms-1" onclick="navigator.clipboard.writeText('${p.id}')">📋</button>
      </td>
      <td><button class="btn btn-outline-secondary btn-sm" onclick="openConsents('${p.id}','${p.firstName} ${p.lastName}')">Consents</button></td>
    </tr>`).join('');
}

async function createPatient(){
  try{
    const p = await post('/api/patients',{
      firstName:document.getElementById('fn').value,
      lastName:document.getElementById('ln').value,
      dateOfBirth:document.getElementById('dob').value,
      gender:document.getElementById('gender').value,
      email:document.getElementById('email').value,
    });
    msg('reg-msg',`Registered: <strong>${p.firstName} ${p.lastName}</strong> — ID: <code>${p.id}</code>`);
    loadPatients();
  }catch(e){msg('reg-msg',e.message,'danger');}
}

async function openConsents(id, name){
  selectedPatientId = id;
  document.getElementById('consent-name').textContent = name;
  document.getElementById('consent-section').style.display='';
  await loadConsents(id);
}

async function loadConsents(id){
  const rows = await get(`/api/consents/patient/${id}`);
  const tb = document.getElementById('consent-list');
  if(!rows.length){tb.innerHTML='<tr><td colspan="4" class="text-muted py-2">No consents granted</td></tr>';return;}
  tb.innerHTML = rows.map(c=>`
    <tr>
      <td>${c.organizationId}</td>
      <td>${new Date(c.grantedAt).toLocaleDateString()}</td>
      <td>${c.expiresAt?new Date(c.expiresAt).toLocaleDateString():'No expiry'}</td>
      <td><button class="btn btn-outline-danger btn-sm" onclick="revokeConsent('${c.id}')">Revoke</button></td>
    </tr>`).join('');
}

async function grantConsent(){
  try{
    const expVal = document.getElementById('exp-date').value;
    await post('/api/consents',{
      patientId: selectedPatientId,
      organizationId: document.getElementById('org-id').value,
      expiresAt: expVal ? new Date(expVal).toISOString() : null,
    });
    msg('consent-msg','Consent granted');
    loadConsents(selectedPatientId);
  }catch(e){msg('consent-msg',e.message,'danger');}
}

async function revokeConsent(id){
  try{
    await del(`/api/consents/${id}`);
    loadConsents(selectedPatientId);
  }catch(e){alert(e.message);}
}

loadPatients();
</script>
</body>
</html>
